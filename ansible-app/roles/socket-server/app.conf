server {
    listen 3000;
    server_name _;

    location /socket.io/ {
        proxy_pass http://localhost:5000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://localhost:5000/;
    }
}
