---
# ============================================
# SigLIP2 PyTorch CLI (pipx run pex 単体構成)
# ============================================

# CLI ソース配置
- name: Create CLI source directory
  file:
    path: /opt/siglip2-cli/src
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy siglip2_cli source
  copy:
    src: cli.py
    dest: /opt/siglip2-cli/src/cli.py
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# PEX ビルド（pipx run pex）
- name: Build SigLIP2 CLI PEX
  shell: |
    pipx run pex \
      torch \
      transformers \
      Pillow \
      numpy \
      -D /opt/siglip2-cli/src \
      -m cli \
      --python=/usr/bin/python3 \
      --python-shebang=/usr/bin/python3 \
      --disable-cache \
      --no-emit-warnings \
      --include-tools \
      --resolve-local-platform \
      -o /opt/siglip2-cli/siglip2_cli.pex
  args:
    executable: /bin/bash

# /usr/local/bin に配置
- name: Install siglip2_cli command
  file:
    src: /opt/siglip2-cli/siglip2_cli.pex
    dest: /usr/local/bin/siglip2_cli
    state: link
    owner: root
    group: root
    mode: "0755"
