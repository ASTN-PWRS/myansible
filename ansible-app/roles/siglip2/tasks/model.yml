---
# モデル保存ディレクトリ
- name: Create SigLIP2 model directory
  file:
    path: /opt/models/SigLIP2
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# 必要パッケージ
- name: Install Python packages for SigLIP2 ONNX build
  pip:
    name:
      - transformers
      - torch
      - onnx
      - onnxruntime
      - onnxruntime-tools
    state: present

# SigLIP2 → ONNX → INT8 量子化スクリプト配置
- name: Copy SigLIP2 ONNX build script
  copy:
    dest: /opt/models/SigLIP2/build_siglip2_onnx.py
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
    content: |
      import torch
      from transformers import AutoModel
      from onnxruntime.quantization import quantize_dynamic, QuantType

      MODEL_ID = "google/siglip2-base-patch16-224"

      print("Loading PyTorch model...")
      model = AutoModel.from_pretrained(MODEL_ID)
      model.eval()

      dummy = torch.randn(1, 3, 224, 224)

      print("Exporting FP32 ONNX...")
      torch.onnx.export(
          model,
          dummy,
          "/opt/models/SigLIP2/siglip2-vitb.onnx",
          input_names=["images"],
          output_names=["embeddings"],
          dynamic_axes={"images": {0: "batch"}},
          opset_version=17
      )

      print("Quantizing to INT8...")
      quantize_dynamic(
          "/opt/models/SigLIP2/siglip2-vitb.onnx",
          "/opt/models/SigLIP2/siglip2-vitb-int8.onnx",
          weight_type=QuantType.QInt8
      )

      print("Done: /opt/models/SigLIP2/siglip2-vitb-int8.onnx")

# SigLIP2 ONNX 生成実行
- name: Build SigLIP2 ViT-B INT8 ONNX model
  become: yes
  become_user: "{{ ansible_user }}"
  shell: |
    python3 /opt/models/SigLIP2/build_siglip2_onnx.py
  args:
    executable: /bin/bash
