# =========================
# STEP 0: create model dirs
# =========================
- name: Ensure model base directory exists
  file:
    path: "{{ model_base_path }}"
    state: directory
    owner: "{{ model_owner }}"
    group: "{{ model_group }}"
    mode: "0755"
  tags: [install, embedding]

- name: Set model version path
  set_fact:
    model_path: "{{ model_base_path }}/{{ model_version }}"
  tags: [install, embedding]

- name: Ensure model version directory exists
  file:
    path: "{{ model_path }}"
    state: directory
    owner: "{{ model_owner }}"
    group: "{{ model_group }}"
    mode: "0755"
  tags: [install, embedding]

- name: Check if model already exists
  stat:
    path: "{{ model_path }}/config.json"
  register: model_exists
  tags: [install, embedding]

# =========================
# STEP 1: create temporary venv
# =========================
- name: Create temporary venv for embedding build
  command: "/root/.local/bin/uv venv /tmp/embedding-venv"
  args:
    creates: "/tmp/embedding-venv/bin/python"
  when: not model_exists.stat.exists
  tags: [install, embedding]

# =========================
# STEP 2: install dependencies
# =========================
- name: Install dependencies
  command: >
    /root/.local/bin/uv pip install
    --python /tmp/embedding-venv/bin/python
    sentence-transformers==2.7.0
  when: not model_exists.stat.exists
  tags: [install, embedding]

# =========================
# STEP 3: build model
# =========================
- name: Build embedding model
  when: not model_exists.stat.exists
  shell: |
    /tmp/embedding-venv/bin/python - << 'EOF'
    from sentence_transformers import SentenceTransformer
    model = SentenceTransformer("{{ model_name }}")
    model.save("{{ model_path }}")
    EOF
  tags: [install, embedding]

# =========================
# STEP 4: update current symlink
# =========================
- name: Update current symlink
  file:
    src: "{{ model_path }}"
    dest: "{{ model_base_path }}/current"
    state: link
    force: true
  tags: [install, embedding]

# =========================
# STEP 5: cleanup temporary venv
# =========================
- name: Remove temporary embedding venv
  file:
    path: /tmp/embedding-venv
    state: absent
  tags: [install, embedding]

# =========================
# STEP 6: remove old /opt/embedding directory
# =========================
- name: Remove old /opt/embedding directory if exists
  file:
    path: /opt/embedding
    state: absent
  tags: [install, embedding]
