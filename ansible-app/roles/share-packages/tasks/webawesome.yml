# ===========================
# 1. webawesome ディレクトリ作成
# ===========================
- name: Ensure webawesome directory exists
  become: true
  file:
    path: "/home/{{ ansible_user }}/webawesome"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [install, webawesome]

# ===========================
# 2. files/webawesome をコピー
# ===========================
- name: Copy webawesome source
  become: true
  copy:
    src: webawesome/
    dest: "/home/{{ ansible_user }}/webawesome/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [install, webawesome]

# ===========================
# 3. npm install（複数パッケージ）
# ===========================
- name: Install dependencies
  become: true
  become_user: "{{ ansible_user }}"
  shell: |
    export HOME="/home/{{ ansible_user }}"
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

    nvm use --lts

    cd "$HOME/webawesome"

    npm install vite -D
    npm install @awesome.me/webawesome

  args:
    executable: /bin/bash
  tags: [install, webawesome]

# ===========================
# 4. npm run build
# ===========================
- name: Build package
  become: true
  become_user: "{{ ansible_user }}"
  shell: |
    export HOME="/home/{{ ansible_user }}"
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

    nvm use --lts

    cd "$HOME/webawesome"
    npm run build
  args:
    executable: /bin/bash
  tags: [install, webawesome]

# ===========================
# 5. npm run deploy
# ===========================
- name: Deploy package
  become: true
  become_user: "{{ ansible_user }}"
  shell: |
    export HOME="/home/{{ ansible_user }}"
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

    nvm use --lts

    cd "$HOME/webawesome"
    npm run deploy
  args:
    executable: /bin/bash
  tags: [install, webawesome]
