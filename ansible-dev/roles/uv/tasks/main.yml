# ============================
# ユーザ用 uv を /usr/local/bin に配置
# ============================

- name: Ensure /usr/local/bin exists
  become: yes
  file:
    path: /usr/local/bin
    state: directory
    mode: "0755"
  tags: [install]

- name: Copy uv binary for user access
  become: yes
  copy:
    src: /root/.local/bin/uv
    dest: /usr/local/bin/uv
    mode: "0755"
    remote_src: yes
  tags: [install]

- name: Verify user uv installed
  stat:
    path: /usr/local/bin/uv
  register: user_uv_stat
  tags: [install]

- name: Fail if user uv not installed
  fail:
    msg: "User uv binary was not installed correctly"
  when: not user_uv_stat.stat.exists
  tags: [install]

- name: Initialize uv runtime for {{ ansible_user }}
  become: yes
  become_user: "{{ ansible_user }}"
  shell: |
    /usr/local/bin/uv self --version
  args:
    creates: "/home/{{ ansible_user }}/.local/share/uv/python"
  tags: [install]
