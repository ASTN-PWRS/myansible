# ===========================
# 1. ビルドディレクトリ作成（permission は前のまま維持）
# ===========================
- name: Ensure build directory exists
  become: true
  file:
    path: /srv/webawesome
    state: directory
    owner: "{{ ansible_user }}"
    group: www-data
    mode: "0755"
  tags: [install, webawesome]

# ===========================
# 2. files/awesome を配置
# ===========================
- name: Deploy local WebAwesome source
  become: true
  copy:
    src: webawesome/
    dest: /srv/webawesome/
    owner: "{{ ansible_user }}"
    group: www-data
    mode: "0755"
  tags: [install, webawesome]

- name: Install dependencies
  become: true
  become_user: "{{ ansible_user }}"
  shell: |
    export HOME="/home/{{ ansible_user }}"
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

    nvm use --lts

    cd /srv/webawesome
    npm install
  args:
    executable: /bin/bash
  tags: [install, webawesome]

# ===========================
# 4. npm run build（ライブラリビルド）
# ===========================
- name: Build WebAwesome library
  become: true
  become_user: "{{ ansible_user }}"
  shell: |
    export HOME="/home/{{ ansible_user }}"
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

    nvm use --lts

    cd /srv/webawesome
    npm run build
  args:
    executable: /bin/bash
  tags: [install, webawesome]
