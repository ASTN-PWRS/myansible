- name: Stop unattended-upgrades
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no

- name: Install minimal LibreOffice for docx to pdf
  apt:
    name:
      - libreoffice-core
      - libreoffice-writer
      - libreoffice-common
    state: present
    lock_timeout: 300

- name: Install minimal LibreOffice for docx to pdf
  apt:
    name:
      - libreoffice-core
      - libreoffice-writer
      - libreoffice-common
    state: present
    update_cache: yes
