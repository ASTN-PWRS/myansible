---
- name: Ensure model base directory exists
  file:
    path: "{{ model_base_path }}"
    state: directory
    owner: "{{ model_owner }}"
    group: "{{ model_group }}"
    mode: "0755"
  tags: [install, embedding]

- name: Set model version path
  set_fact:
    model_path: "{{ model_base_path }}/{{ model_version }}"
  tags: [install, embedding]

- name: Ensure model version directory exists
  file:
    path: "{{ model_path }}"
    state: directory
    owner: "{{ model_owner }}"
    group: "{{ model_group }}"
    mode: "0755"
  tags: [install, embedding]

- name: Check if model already exists
  stat:
    path: "{{ model_path }}/config.json"
  register: model_exists
  tags: [install, embedding]

# --- uv venv ---
- name: Ensure embedding venv exists
  command: "/root/.local/bin/uv venv /opt/embedding/venv"
  args:
    creates: "/opt/embedding/venv/bin/python"
  tags: [install, embedding]

# --- install ---
- name: Install dependencies
  command: >
    /root/.local/bin/uv pip install
    --python /opt/embedding/venv/bin/python
    sentence-transformers==2.7.0
  when: not model_exists.stat.exists
  tags: [install, embedding]

# --- build ---
- name: Build embedding model
  when: not model_exists.stat.exists
  shell: |
    /opt/embedding/venv/bin/python - << 'EOF'
    from sentence_transformers import SentenceTransformer

    model = SentenceTransformer("{{ model_name }}")
    model.save("{{ model_path }}")
    EOF
  tags: [install, embedding]

# --- currentリンク ---
- name: Update current symlink
  file:
    src: "{{ model_path }}"
    dest: "{{ model_base_path }}/current"
    state: link
    force: true
  tags: [install, embedding]
