# ===========================
# 1. build ディレクトリ作成
# ===========================
- name: Ensure build directory exists
  become: yes
  ansible.builtin.file:
    path: /opt/embed/build
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ===========================
# 2. 古い成果物削除
# ===========================
- name: Remove old embed binary
  become: yes
  ansible.builtin.file:
    path: /opt/embed/build/embed-binary
    state: absent

- name: Remove old venv
  become: yes
  ansible.builtin.file:
    path: /opt/embed/build/.venv
    state: absent

# ===========================
# 3. ソース配置
# ===========================
- name: Sync embed source project
  become: yes
  ansible.builtin.copy:
    src: embed-src/
    dest: /opt/embed/build/
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: preserve

# ===========================
# 4. pipx
# ===========================
- name: Install pipx
  become: yes
  ansible.builtin.apt:
    name:
      - pipx
    state: present
    update_cache: yes

# ===========================
# 5. キャッシュ
# ===========================
- name: Ensure cache directories exist
  become: yes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /opt/embed/.cache
    - /opt/embed/.cache/pip
    - /opt/embed/.cache/pex
    - /opt/embed/.cache/huggingface

# ===========================
# 6. Python 3.13 検出
# ===========================
- name: Find uv python3.13
  become: yes
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: |
    export HOME="/home/{{ ansible_user }}"
    uv python find 3.13
  args:
    executable: /bin/bash
  register: uv_python
  changed_when: false

- name: Show python path
  ansible.builtin.debug:
    var: uv_python.stdout

# ===========================
# 7. PEX / SCIE ビルド
# ===========================
- name: Build embed-binary
  become: yes
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: |
    set -euo pipefail

    cd /opt/embed/build

    export HOME="/home/{{ ansible_user }}"
    export PIP_CACHE_DIR="/opt/embed/.cache/pip"
    export PEX_ROOT="/opt/embed/.cache/pex"
    export HF_HOME="/opt/embed/.cache/huggingface"

    pipx run pex \
      --python "{{ uv_python.stdout }}" \
      . \
      -e embed.cli:main \
      --scie lazy \
      -o embed-binary
  args:
    executable: /bin/bash

# ===========================
# 8. ビルド確認
# ===========================
- name: Verify built binary exists
  become: yes
  ansible.builtin.stat:
    path: /opt/embed/build/embed-binary
  register: embed_binary

- name: Fail if binary build failed
  ansible.builtin.fail:
    msg: "embed-binary was not generated"
  when: not embed_binary.stat.exists

- name: Show binary size
  become: yes
  ansible.builtin.shell: |
    ls -lh /opt/embed/build/embed-binary
  register: binary_size
  changed_when: false

- name: Display binary size
  ansible.builtin.debug:
    var: binary_size.stdout

# ===========================
# 9. インストール
# ===========================
- name: Install embed-binary
  become: yes
  ansible.builtin.copy:
    src: /opt/embed/build/embed-binary
    dest: /usr/local/bin/embed-binary
    remote_src: yes
    owner: root
    group: root
    mode: "0755"

# ===========================
# 10. 配置確認
# ===========================
- name: Verify embed-binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/embed-binary
  register: embed_binary_installed

- name: Fail if embed-binary missing
  ansible.builtin.fail:
    msg: "embed-binary was not installed"
  when: not embed_binary_installed.stat.exists

# ===========================
# 11. モデル権限
# ===========================
- name: Ensure embedding model readable by all users
  become: yes
  ansible.builtin.file:
    path: /opt/models/bge-m3
    recurse: yes
    mode: "a+rX"

# ===========================
# 12. Warmup
# ===========================
- name: Warmup embed-binary
  become: yes
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: |
    export HOME="/home/{{ ansible_user }}"
    export PEX_ROOT="/opt/embed/.cache/pex"
    export HF_HOME="/opt/embed/.cache/huggingface"

    echo "warmup" | /usr/local/bin/embed-binary >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
