- name: Check if Llama 3.1 model exists
  become: yes
  become_user: asao
  stat:
    path: "/home/asao/.ollama/models/llama3.1"
  register: llama_model

- name: Pull Llama 3.1 model
  become: yes
  become_user: asao
  command: ollama pull llama3.1
  when: not llama_model.stat.exists
  register: llama_pull_result

- debug:
    msg: "Llama 3.1 model pulled: {{ llama_pull_result.stdout | default('already exists') }}"
