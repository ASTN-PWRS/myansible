<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Center</title>

    <!-- Web Awesome -->
    <link rel="stylesheet" href="/share/webawesome/styles/webawesome.css" />
    <link rel="stylesheet" href="/share/webawesome/styles/themes/default.css" />
    <link rel="stylesheet" href="/share/css/fonts.css" />
    <script type="module">
      import "/share/webawesome/components/page/page.js";
      import "/share/webawesome/components/card/card.js";
      import "/share/webawesome/components/button/button.js";
      import "/share/webawesome/components/icon/icon.js";
    </script>
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/theme-toggle.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    wa-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* main を中央配置のための flex コンテナにする */
    main {
      flex: 1;
      display: flex;
      flex-direction: column; /* justify-content が上下方向に効く */
      height: 100vh;
    }

    /* wa-justify-content-center と wa-align-items-center を main に適用 */
    main.wa-justify-content-center {
      justify-content: center; /* 上下中央 */
    }
    main.wa-align-items-center {
      align-items: center;     /* 左右中央 */
    }

    .drop-card {
      width: 60vw;
      max-width: 600px;
      text-align: center;
    }

    .drop-inner {
      padding: 2rem;
    }
  </style>
</head>

<body>
  <wa-page>
    <!-- Main（overlay なしで中央配置） -->
    <main class="wa-justify-content-center wa-align-items-center">
      <wa-card class="drop-card" id="drop-zone">
        <div slot="header">ファイルをドロップ</div>
        <div class="drop-inner">
          <wa-icon name="upload" size="2xl"></wa-icon>
          <p>ここにファイルをドロップしてください</p>
        </div>
        <div slot="footer">PDF / 画像 / ZIP など対応</div>
      </wa-card>
    </main>
  </wa-page>
</body>
</html>
なるほど、header と footer を外したら中央に来た理由は完全に説明できるよ。
そして、header / footer を入れたままでも中央にできる “正しい最小 CSS” も提示する。
