<!doctype html>
<html
  lang="ja"
  class="wa-theme-default wa-palette-default wa-brand-blue wa-dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web Awesome Layout</title>

    <!-- ★ Web Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.7.0/styles/webawesome.css"
    />
    <script
      type="module"
      src="https://ka-f.webawesome.com/webawesome@3.7.0/webawesome.esm.js"
    ></script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* ブラウザのスクロールは消す */
      }

      wa-page {
        height: 100vh;
      }

      header[slot="header"] {
        background: var(--wa-color-brand);
      }

      footer[slot="footer"] {
        background: var(--wa-color-brand);
      }

      nav[slot="menu"] {
        width: 250px;
        display: block;
        overflow: hidden;
        border-right: 0.5px solid var(--wa-color-neutral-border-quiet);
        height: 100%;
      }

      /* ★ main を「相対配置の箱」にする */
      main {
        position: relative;
        height: calc(100% - 80px); /* ← footer の高さを引く */
        padding: 0;
      }

      #inner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;

        overflow-y: auto;
        box-sizing: border-box;
        bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        width: 100%;
        padding: 1em;
      }

      #inner::-webkit-scrollbar {
        width: 10px;
      }
      #inner::-webkit-scrollbar-track {
        background: #f0f0f0;
      }
      #inner::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }
      #inner::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>

  <body>
    <wa-page>
      <!-- HEADER -->
      <header slot="header" class="wa-split">
        <div class="wa-cluster">
          <button class="menu-trigger normal">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <span class="wa-heading-m">Test Worldwide</span>
        </div>
      </header>

      <!-- MAIN -->
      <main>
        <div id="inner">
          <wa-card style="display: flex; width: 400px; height: 200px">
            <div style="padding: 2rem">Drop</div>
          </wa-card>

          <wa-textarea
            resize="auto"
            rows="6"
            apperance="outlined"
            placeholder="検索条件を入力してください"
          ></wa-textarea>

          <div class="wa-stack" id="list"></div>
        </div>
      </main>

      <!-- FOOTER -->
      <footer slot="footer">
        <div class="wa-cluster">© 2026</div>
      </footer>
    </wa-page>

    <script>
      // 1〜100 の div を生成
      const list = document.getElementById("list");
      list.innerHTML = Array.from(
        { length: 100 },
        (_, i) => `<div>${i + 1}</div>`,
      ).join("");
    </script>
  </body>
</html>
