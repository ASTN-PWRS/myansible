<!doctype html>
<html lang="ja" class="wa-theme-default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
    <link rel="stylesheet" type="text/css" href="/webawesome/webawesome.css" />
    <link rel="stylesheet" type="text/css" href="/webawesome/default.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      wa-page::part(base) {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-grow: 0;
        justify-content: space-between;
        align-items: center;
        padding: 10px 10px;
        height: 12vh;
        background-color: light-dark(
          var(--wa-color-brand-60),
          var(--wa-color-brand-05)
        );
      }
      main {
        display: flex;
        flex-grow: 1;
        height: 76vh;
        overflow-y: auto;
        padding: 16px;
        background: var(--wa-color-surface-lowered);
        gap: 10px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 10px;
        height: 12vh;
        background-color: light-dark(
          var(--wa-color-brand-60),
          var(--wa-color-brand-05)
        );
      }
    </style>
  </head>
  <body>
    <wa-page>
      <header class="wa-split" slot="header">
        <div class="wa-cluster" style="height: 2rem">
          <wa-icon name="hat-wizard" style="color: mediumpurple"></wa-icon>
          <span id="brand-name" class="wa-heading-m wa-desktop-only"
            >Test Worldwide</span
          >
        </div>
      </header>
      <main class="wa-grid" style="flex-grow: 1">
        <div class="wa-justify-content-center wa-align-items-center">
          <wa-card>Drop</wa-card>
        </div>
      </main>
      <footer class="wa-split" slot="footer">
        <div class="wa-cluster" style="height: 2rem">© 2026</div>
      </footer>
    </wa-page>

    <script>
      const dialog = document.querySelector("#dialog-overview");
      const btn = document.querySelector("#btn");

      btn.addEventListener("click", () => (dialog.open = true));
    </script>

    <script src="/webawesome/webawesome.js"></script>
    <script type="module">
      import { loadImageToView } from "/src/stub.js";
      loadImageToView("/zako.webp");
    </script>
  </body>
</html>
