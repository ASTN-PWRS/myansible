<!doctype html>
<html lang="ja" class="wa-theme-default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web Awesome Layout</title>

    <link rel="stylesheet" href="/webawesome/default.css" />
    <link rel="stylesheet" href="/webawesome/webawesome.css" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* ← ブラウザのスクロールバーを完全に消す */
      }

      body {
        height: 100vh;
      }

      wa-page {
        height: 100vh;
      }

      /* Shadow DOM root */
      wa-page::part(base) {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }

      /* body 部分 */
      wa-page::part(body) {
        flex: 1;

        min-height: 0;
      }

      /* main */
      main {
        height: 100%;
        min-height: 0;
        padding: 0;
        display: flex;
        overflow-y: auto;
        justify-content: center;
        align-items: center;
      }

      header,
      footer {
        background: var(--wa-color-brand-60);
        color: white;
        padding: 1rem;
      }
    </style>
  </head>

  <body>
    <wa-page>
      <!-- HEADER -->
      <header slot="header" class="wa-split wa-container">
        <div class="wa-cluster">
          <wa-icon name="hat-wizard"></wa-icon>
          <span class="wa-heading-m"> Test Worldwide </span>
        </div>
      </header>

      <!-- MAIN -->
      <main>
        <div
          style="
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid green;
          "
        >
          <wa-card style="display: flex; width: 400px; height: 200px">
            <div style="padding: 2rem">Drop</div>
          </wa-card>
        </div>
      </main>

      <!-- FOOTER -->
      <footer slot="footer" class="wa-split wa-container">
        <div class="wa-cluster">© 2026</div>
      </footer>
    </wa-page>

    <script src="/webawesome/webawesome.js"></script>
  </body>
</html>
